plugins { id "com.android.application" }

// Release signing comes from keystore.properties (not committed). Without it, release builds use
// the debug key, which still installs fine but won't match assetlinks.json (no auto-open of links).
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "org.datapeaks.expert"
    compileSdk 35

    defaultConfig {
        applicationId "org.datapeaks.expert"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
        // The server the app shows. Change it and rebuild to point the app at another deployment.
        buildConfigField "String", "APP_URL", '"https://data-peaks-expert.onrender.com"'
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
